[project]
name = "quizzy"
version = "0.1.0"
description = "REST API example with FastAPI, Pydantic and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
